[project]
name = "parley"
description = "EX06 — Dual AI Agent Conversation via MCP Servers: a Cops & Robbers chase between two autonomous LLM agents talking in free natural language (uoh-sqak)"
authors = [
    { name = "Salah Qadah" },
    { name = "Andalus Kalash" },
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy / external runtime deps used only for the REAL pipeline (live LLM,
# real Gmail send, GUI). Tests and CI never install these — every external
# op is mocked, so the grader needs no API key, no creds, no display.
real = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.0",
]

[project.scripts]
parley = "parley.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/parley/shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=parley --cov-report=term-missing"

[tool.coverage.run]
source = ["parley"]
omit = ["tests/*", "*/fixtures/*", "*/gui/tk_renderer.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
